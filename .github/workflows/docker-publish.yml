name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# @spec SHIP-CI-003
permissions: {}

jobs:
  # The organization's shared scan, pointed at this repository's two lockfiles.
  # @spec SHIP-SUPPLY-001, SHIP-SUPPLY-002, SHIP-SUPPLY-003
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@4a56829e5f1be54347d6708b0a86972e56d594ac # v1.3.0
    with:
      npm-dir: frontend
      cargo-dir: backend
      socket-dir: frontend
      node-version: "26"
      cargo-deny: true
    # Pass only the secret the reusable workflow declares, not the whole store.
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  # The merge gates, run here on pushes and tags so an untested commit can
  # never publish. Pull requests already run them via ci.yml's own trigger.
  # @spec SHIP-CI-001, SHIP-RELEASE-001
  ci:
    name: CI
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The organization's shared publish workflow builds, pushes, signs and
  # attests; this repository cannot alter those steps.
  # @spec SHIP-RELEASE-001, SHIP-RELEASE-002, SHIP-IMAGE-001
  image:
    needs: [supply-chain, ci]
    # `ci` is skipped on pull requests; a skipped dependency must not block
    # the build-only PR run, but a failed one must block a publish.
    if: ${{ !cancelled() && needs.supply-chain.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: chainringlabs/ci/.github/workflows/docker-publish.yml@4a56829e5f1be54347d6708b0a86972e56d594ac # v1.3.0
