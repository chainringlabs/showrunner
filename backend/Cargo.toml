[package]
name = "showrunner-backend"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Showrunner — TV show tracking across streaming and cable"
authors = ["tgrecojr"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
# `tower` proper (not just tower-http) for ConcurrencyLimitLayer + LoadShedLayer:
# the router needs an in-flight ceiling, which tower-http doesn't provide.
# Already in the tree transitively via axum and tower-http.
tower = { version = "0.5", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "limit", "set-header", "timeout"] }
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }

# @spec SHIP-IMAGE-002
# HTTP client (TMDB). Use `rustls` instead of the default native-tls
# so the runtime image doesn't need libssl. This feature verifies TLS via
# rustls-platform-verifier, which reads the image's CA bundle at
# /etc/ssl/certs (see the runtime stage in the Dockerfile). Other features
# are the reqwest defaults we'd otherwise lose with default-features=false.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "charset", "http2", "system-proxy"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# @spec APP-CONFIG-006, SHIP-SUPPLY-006
# Date/Time. `tzdb-bundle-always` compiles the IANA tz database into the
# binary; config.rs resolves TIMEZONE against that copy only, so the
# distroless runtime image needs no zone files. Held at 0.2 because croner 4
# is built against jiff ^0.2; raise both together. renovate.json carries the
# matching `allowedVersions` hold.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"


# Cron expression parsing for the resync schedule (scheduler.rs). Default
# features would pull in chrono; only the jiff backend is used.
croner = { version = "4", default-features = false, features = ["jiff"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serial_test = "4"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
